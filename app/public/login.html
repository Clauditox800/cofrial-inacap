<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cofrial · Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container my-5" style="max-width: 520px">
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-login">Iniciar sesión</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-registro">Crear cuenta (B2C)</button></li>
  </ul>
  <div class="tab-content card card-body">
    <div class="tab-pane fade show active" id="tab-login">
      <form id="form-login" class="vstack gap-2">
        <input name="email" type="email" class="form-control" placeholder="Correo" required autocomplete="username">
        <input name="password" type="password" class="form-control" placeholder="Contraseña" required autocomplete="current-password">
        <button class="btn btn-cofrial">Entrar</button>
      </form>
      <p class="small text-muted mt-3 mb-0">Clientes institucionales (B2B): su ejecutivo comercial les entrega la cuenta desde el CRM.
        Personal de Cofrial: usa tu correo corporativo.</p>
    </div>
    <div class="tab-pane fade" id="tab-registro">
      <form id="form-registro" class="vstack gap-2">
        <input name="nombre" class="form-control" placeholder="Nombre completo" required>
        <input name="rut" class="form-control" placeholder="RUT (12.345.678-9)" required>
        <input name="email" type="email" class="form-control" placeholder="Correo" required>
        <input name="telefono" class="form-control" placeholder="Teléfono">
        <input name="password" type="password" minlength="6" class="form-control" placeholder="Contraseña (mín. 6)" required>
        <div class="row g-2">
          <div class="col-7"><input name="calle" class="form-control" placeholder="Calle"></div>
          <div class="col-5"><input name="numero" class="form-control" placeholder="Número"></div>
        </div>
        <select name="id_comuna" id="comunas" class="form-select"></select>
        <button class="btn btn-cofrial">Crear cuenta</button>
      </form>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
  renderNav('');
  const volver = new URLSearchParams(location.search).get('volver');

  function entrar(r) {
    Sesion.guardar(r.token, r.usuario);
    const staff = ['ADMIN', 'VENDEDOR', 'DESPACHADOR'].includes(r.usuario.rol);
    location.href = volver && volver.startsWith('/') ? volver : staff ? (r.usuario.rol === 'DESPACHADOR' ? '/dashboard' : '/crm') : '/';
  }

  document.getElementById('form-login').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    try { entrar(await api('/auth/login', { method: 'POST', body: Object.fromEntries(new FormData(ev.target)) })); }
    catch (e) { aviso(e.message, 'danger'); }
  });

  document.getElementById('form-registro').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target));
    d.direccion = d.calle ? { calle: d.calle, numero: d.numero, id_comuna: Number(d.id_comuna) } : null;
    try { entrar(await api('/auth/registro', { method: 'POST', body: d })); }
    catch (e) { aviso(e.message, 'danger'); }
  });

  api('/comunas').then((cs) => {
    document.getElementById('comunas').innerHTML = cs.map((c) => `<option value="${c.id_comuna}">${esc(c.nombre)}</option>`).join('');
  });
</script>
</body>
</html>
