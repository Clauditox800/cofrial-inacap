<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cofrial · Mis pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container my-4">
  <h1 class="h4 mb-3">Mis pedidos</h1>
  <div id="lista" class="vstack gap-3"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
  renderNav('pedidos');
  const PASOS = ['PENDIENTE', 'CONFIRMADO', 'EN_PREPARACION', 'DESPACHADO', 'ENTREGADO'];

  async function cargar() {
    const pedidos = await api('/pedidos/mios');
    document.getElementById('lista').innerHTML = pedidos.map((p) => {
      const paso = PASOS.indexOf(p.estado);
      const avance = p.estado === 'CANCELADO' ? 100 : ((paso + 1) / PASOS.length) * 100;
      return `
      <div class="card">
        <div class="card-body">
          <div class="d-flex flex-wrap justify-content-between gap-2">
            <div><b>Orden #${p.id_pedido}</b> · ${fecha(p.fecha)} <div class="small text-muted">${esc(p.direccion)}</div></div>
            <div class="text-end">${badge(p.estado)}<div class="fw-semibold">${clp(p.total)}</div></div>
          </div>
          <div class="progress my-2" style="height:6px"><div class="progress-bar ${p.estado === 'CANCELADO' ? 'bg-danger' : 'bg-success'}" style="width:${avance}%"></div></div>
          <details>
            <summary class="small">Detalle y seguimiento</summary>
            <div class="row mt-2 small">
              <div class="col-md-6">${p.detalle.map((d) => `<div>${d.cantidad} ${esc(d.unidad)} · ${esc(d.nombre)} <span class="text-muted">(${clp(d.precio_unitario)})</span></div>`).join('')}</div>
              <div class="col-md-6">${p.historial.map((h) => `<div>${fecha(h.fecha)} · ${badge(h.estado)} ${esc(h.comentario || '')}</div>`).join('')}</div>
            </div>
          </details>
        </div>
      </div>`;
    }).join('') || '<p class="text-muted">Aún no tienes pedidos. <a href="/">Ir a la tienda</a></p>';
  }

  if (exigirRol('CLIENTE_B2B', 'CLIENTE_B2C')) { cargar(); setInterval(cargar, 15000); }
</script>
</body>
</html>
