# Entorno de prueba local completo (MySQL + app + 3 camiones simulados), sin AWS.
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml exec app node scripts/init-db.js   (primera vez)
#   abrir http://localhost:3000
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: cofrial-local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcofrial-local"]
      interval: 5s
      retries: 20

  app:
    build: { context: ., dockerfile: app/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: cofrial-local
      DB_NAME: cofrial
      JWT_SECRET: secreto-local-de-prueba
      IOT_SECRET: iot-local
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  cam-001:
    build: ./iot
    depends_on: [app]
    restart: unless-stopped
    environment: { CAMION_ID: CAM-001, PERFIL: CONGELADO, RUTA: villarrica, API_URL: "http://app:3000/api/telemetria", IOT_SECRET: iot-local, PROB_FALLA: "0.05" }
  cam-002:
    build: ./iot
    depends_on: [app]
    restart: unless-stopped
    environment: { CAMION_ID: CAM-002, PERFIL: CONGELADO, RUTA: angol, API_URL: "http://app:3000/api/telemetria", IOT_SECRET: iot-local, PROB_FALLA: "0.05" }
  cam-004:
    build: ./iot
    depends_on: [app]
    restart: unless-stopped
    environment: { CAMION_ID: CAM-004, PERFIL: REFRIGERADO, RUTA: pucon, API_URL: "http://app:3000/api/telemetria", IOT_SECRET: iot-local, PROB_FALLA: "0.05" }
